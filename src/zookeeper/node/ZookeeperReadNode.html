<script type="text/markdown" template-section="onIncludeDocumentation">
Reads the current value of a ZooKeeper node whenever a message is received.

### Properties

: *name*        (string) : Display label for this node.
: *server*      (config) : The Zookeeper Server config node providing the connection.
: *node path*   (typed)  : The ZooKeeper path to read. Supports `msg`, `flow`, `global`, and `str` (literal) types - e.g. set to `msg` / `topic` to read the path from `msg.topic`.
: *output path* (typed)  : Where to write the result. Supports `msg`, `flow`, and `global` types. Defaults to `msg` / `payload`.
: *return empty values* (boolean) : When checked, a message is still forwarded if the ZooKeeper path does not exist — the output path is simply left unset. When unchecked (default), the node produces no output for missing paths.

### Inputs

: *msg* : Any message - triggers a read. The message is passed through with the result written at the configured output path.

### Outputs

: *msg* : The input message with the ZooKeeper value merged in at the configured output path. The value is parsed as JSON if possible; otherwise written as a plain string.

### Details

The input message passes through unchanged except for the value written at **Output Path**. If the path does not exist in ZooKeeper and **Return empty values** is unchecked, the node produces no output. If **Return empty values** is checked, the message is forwarded with the output path left unset.

### Example

**Node Path:** `msg` / `topic`
**Output Path:** `msg` / `payload.config`

Input message:
```json
{ "topic": "/services/myapp/config", "payload": {} }
```

Output message:
```json
{ "topic": "/services/myapp/config", "payload": { "config": { "retries": 3, "timeout": 5000 } } }
```

### References
- [Apache ZooKeeper](https://zookeeper.apache.org/)
</script>
