<script type="text/markdown" template-section="onIncludeDocumentation">
Subscribes to a ZooKeeper node path and emits a message each time the value at that path changes.

### Properties

: *name*                 (string) : Display label for this node.
: *server*               (config) : The Zookeeper Server config node providing the connection.
: *subscription*         (string) : The ZooKeeper node path to watch (e.g. `/my/service/config`).
: *get value on subscribe* (bool) : If enabled, immediately reads and emits the current value when the subscription is first established (including on flow deployment).

### Outputs

: *msg.topic*   (string) : The ZooKeeper path that changed.
: *msg.payload* (any)    : The new value at that path. Parsed as JSON if possible; otherwise a plain string.

### Details

The node subscribes to the configured path and fires on every `NODE_DATA_CHANGED` event. If the node does not yet exist in ZooKeeper at startup, the subscription waits until it is created and then begins watching automatically.

On redeploy, active watchers are released when the underlying ZooKeeper connection closes.

### References
- [Apache ZooKeeper](https://zookeeper.apache.org/)
