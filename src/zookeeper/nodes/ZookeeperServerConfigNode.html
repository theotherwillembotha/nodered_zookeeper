<script type="text/javascript" template-section="onIncludeEditPrepare">
{
    let node = this;

    $("#zk-test-connection-btn").on("click", function() {
        let $btn = $(this);
        let $result = $("#zk-test-connection-result");

        let servers = $("#node-config-input-servers").val();

        $result.text("Testing...").css("color", "gray");
        $btn.prop("disabled", true);

        $.ajax({
            url: "zookeeperservice/testconnection",
            type: "POST",
            contentType: "application/json; charset=utf-8",
            data: JSON.stringify({ servers: servers }),
            success: function(response) {
                $result.text("\u2714 " + response.message).css("color", "green");
            },
            error: function(jqXHR) {
                let msg = "Connection failed";
                try {
                    let body = JSON.parse(jqXHR.responseText);
                    if (body.error) { msg = body.error; }
                } catch(e) {}
                $result.text("\u2718 " + msg).css("color", "red");
            },
            complete: function() {
                $btn.prop("disabled", false);
            }
        });
    });
}
</script>

<script type="text/markdown" template-section="onIncludeDocumentation">
Connection configuration for an Apache ZooKeeper ensemble. Referenced by all ZooKeeper nodes in the flow.

### Properties

: *name*     (string) : A descriptive label for this connection.
: *servers*  (string) : Comma-separated list of ZooKeeper server addresses in `host and port` format.
: *username* (string) : Optional authentication username.
: *password* (string) : Optional authentication password.

### Details

Single server:
```
zookeeper:2181
```

Ensemble (multiple servers):
```
host1:2181,host2:2181,host3:2181
```

### Actions

**Test Connection** — attempts to connect to the configured ZooKeeper ensemble and reports success or failure inline without saving the node. Times out after 5 seconds if the server is unreachable.

### References
- [Apache ZooKeeper](https://zookeeper.apache.org/)
</script>
